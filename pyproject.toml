[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server"
version = "0.1.0"
authors = [
    {name = "Reinaldo Saraiva", email = "reinaldo.saraiva@gmail.com"},
]
description = "Multi-tool Control Platform Server for infrastructure management"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.4.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
mcp-server = "mcp_server.cli:main"
netbox-gpt = "netbox_gpt.assistant:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server", "src/netbox_gpt"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "README.md",
    "pyproject.toml",
    "LICENSE.md",
]