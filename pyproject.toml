[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netbox-gpt"
version = "0.1.0"
authors = [
    {name = "Reinaldo Saraiva", email = "reinaldo.saraiva@gmail.com"},
]
description = "ChatGPT-powered natural language interface for NetBox"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.scripts]
netbox-gpt = "netbox_gpt.assistant:main"

[tool.hatch.build.targets.wheel]
packages = ["src/netbox_gpt"]